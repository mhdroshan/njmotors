<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bodyGrad_scooter-silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="metallicDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="seatGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="300" cy="385" rx="230" ry="16" fill="#000000" opacity="0.15" filter="url(#glow)"/>
  <ellipse cx="300" cy="385" rx="180" ry="9" fill="#000000" opacity="0.25"/>

  <!-- Rear Wheel Assembly -->
  <g class="rear-wheel">
    <circle cx="150" cy="320" r="58" fill="#1e293b"/>
    <circle cx="150" cy="320" r="44" fill="#0f172a" stroke="#334155" stroke-width="3"/>
    <circle cx="150" cy="320" r="32" fill="url(#rimGrad)"/>
    <circle cx="150" cy="320" r="16" fill="#0f172a"/>
    <circle cx="150" cy="320" r="7" fill="#94a3b8"/>
    <path d="M150,292 L150,306 M150,334 L150,348 M122,320 L136,320 M164,320 L178,320 M130,300 L140,310 M160,330 L170,340 M130,340 L140,330 M160,310 L170,300" stroke="#cbd5e1" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="150" cy="320" r="23" fill="none" stroke="#94a3b8" stroke-dasharray="3,3" stroke-width="2"/>
  </g>

  <!-- Front Wheel Assembly -->
  <g class="front-wheel">
    <circle cx="450" cy="320" r="58" fill="#1e293b"/>
    <circle cx="450" cy="320" r="44" fill="#0f172a" stroke="#334155" stroke-width="3"/>
    <circle cx="450" cy="320" r="32" fill="url(#rimGrad)"/>
    <circle cx="450" cy="320" r="16" fill="#0f172a"/>
    <circle cx="450" cy="320" r="7" fill="#94a3b8"/>
    <path d="M450,292 L450,306 M450,334 L450,348 M422,320 L436,320 M464,320 L478,320 M430,300 L440,310 M460,330 L470,340 M430,340 L440,330 M460,310 L470,300" stroke="#cbd5e1" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="450" cy="320" r="24" fill="none" stroke="#e2e8f0" stroke-dasharray="3,3" stroke-width="2.5"/>
    <rect x="462" y="308" width="12" height="14" rx="3" fill="#ef4444"/>
  </g>

  <!-- Rear Fender / Hugger -->
  <path d="M102,310 Q112,250 178,255 L180,270 Q130,265 118,312 Z" fill="#1e293b"/>

  <!-- Main Chassis / Frame Underbody -->
  <path d="M150,320 L210,315 L240,345 L370,345 L415,240 L450,320" fill="none" stroke="#334155" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Front Telescopic Fork Suspension -->
  <g class="front-fork">
    <line x1="450" y1="320" x2="415" y2="185" stroke="#64748b" stroke-width="10" stroke-linecap="round"/>
    <line x1="450" y1="320" x2="435" y2="250" stroke="#cbd5e1" stroke-width="7" stroke-linecap="round"/>
    <path d="M410,250 Q435,240 480,270 L488,285 Q440,255 410,270 Z" fill="url(#bodyGrad_scooter-silver)"/>
  </g>

  <!-- Footboard / Deck -->
  <rect x="235" y="325" width="135" height="18" rx="5" fill="#0f172a"/>
  <rect x="245" y="327" width="115" height="5" rx="2" fill="#334155"/>
  <rect x="245" y="334" width="115" height="4" rx="2" fill="#2eb24c"/>

  <!-- Main Body Shell / Fairing -->
  <path d="M140,275 Q175,210 245,210 L310,210 Q325,230 335,275 L330,325 L230,325 Q180,315 140,275 Z" fill="url(#bodyGrad_scooter-silver)"/>
  
  <!-- Sleek Body Accent Cuts -->
  <path d="M190,245 L275,245 L255,268 L175,268 Z" fill="#1e293b" opacity="0.6"/>
  <path d="M210,252 L260,252" stroke="#2eb24c" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Front Apron / Shield -->
  <path d="M330,285 L385,170 Q405,120 425,125 L435,160 Q420,240 375,325 L330,325 Z" fill="url(#bodyGrad_scooter-silver)"/>
  <path d="M360,240 L400,165 L395,270 Z" fill="#1e293b" opacity="0.3"/>

  <!-- Seat -->
  <path d="M175,210 C185,185 220,180 270,182 C305,183 325,195 330,210 C300,215 250,218 175,210 Z" fill="url(#seatGrad)"/>
  <path d="M148,220 Q155,175 170,175 L178,185 Q168,185 160,220 Z" fill="#475569"/>

  <!-- Handlebar & Headlight Cowl -->
  <g class="handlebar-cluster">
    <line x1="418" y1="135" x2="410" y2="95" stroke="#334155" stroke-width="12" stroke-linecap="round"/>
    <path d="M390,95 Q415,78 435,90 L440,115 Q410,120 385,108 Z" fill="url(#bodyGrad_scooter-silver)"/>
    <rect x="370" y="92" width="22" height="10" rx="3" fill="#0f172a"/>
    <path d="M365,99 L385,99" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <rect x="428" y="88" width="22" height="10" rx="3" fill="#0f172a" transform="rotate(-5, 428, 88)"/>
    <path d="M435,94 L455,92" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <path d="M398,90 Q385,60 365,55 L350,60 Q368,68 392,90" fill="#334155"/>
    <ellipse cx="355" cy="58" rx="14" ry="8" fill="#1e293b" stroke="#64748b" stroke-width="1.5" transform="rotate(-15, 355, 58)"/>
    
    <path d="M433,95 Q442,102 438,112 L430,110 Q433,102 425,97 Z" fill="#e0f2fe" filter="url(#glow)"/>
    <polygon points="420,175 428,185 410,215 404,212 418,185" fill="#38bdf8" filter="url(#glow)"/>
  </g>

  <!-- Tail Light -->
  <path d="M142,260 L146,245 L155,248 L148,265 Z" fill="#ef4444" filter="url(#glow)"/>

  <!-- Urban Bikes Badge -->
  <g transform="translate(255, 275)">
    <rect x="0" y="0" width="58" height="18" rx="4" fill="#0f172a" opacity="0.9"/>
    <text x="29" y="12.5" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="8.5" font-weight="800" fill="#2eb24c" text-anchor="middle" letter-spacing="0.5">URBAN</text>
  </g>

  <!-- Non-RTO / No License Badge Floating Tag -->
  <g transform="translate(435, 60)">
    <rect x="0" y="0" width="125" height="30" rx="15" fill="#2eb24c" opacity="0.95"/>
    <circle cx="15" cy="15" r="9" fill="#ffffff"/>
    <path d="M11 15 L14 18 L19 12" stroke="#2eb24c" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <text x="70" y="19" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">NO LICENSE REQ.</text>
  </g>
</svg>